//
// EffectiveConfigService: returns the resolved configuration value
// for each section along with which tier (default / file / settings
// / override) contributed it, and accepts transient session overrides
// (Tier 4). Mirrors:
//
//   - protolsp/getEffectiveConfig    -> GetEffectiveConfig
//   - protolsp/setOverrides           -> SetOverrides
//   - protolsp/effectiveConfigChanged -> Subscribe (server stream)
//
// Values are typed via a oneof so the wire shape doesn't fall back
// to JSON-blob `any` semantics — current sections are all strings,
// but the oneof is forward-compatible with bool / list-of-strings
// sections.

syntax = "proto3";

package protolsp.v1.rpc;

option go_package = "github.com/trendvidia/protolsp/proto/protolsp/v1/rpc;rpcpb";

import "protolsp/v1/rpc/common.proto";

// ConfigSource names which tier supplied a section's effective value.
// String values mirror the JSON-RPC enum.
enum ConfigSource {
  CONFIG_SOURCE_UNSPECIFIED = 0;
  CONFIG_SOURCE_DEFAULT = 1;
  CONFIG_SOURCE_FILE = 2;
  CONFIG_SOURCE_SETTINGS = 3;
  CONFIG_SOURCE_OVERRIDE = 4;
}

// ConfigSectionValue is a typed wrapper around the heterogeneous
// values different sections take. Each oneof case maps directly to
// one of the kinds the JSON-RPC `any` payload was implicitly using.
message ConfigSectionValue {
  oneof value {
    string string_value = 1;
    bool bool_value = 2;
    StringList string_list_value = 3;
  }
}

message ConfigValue {
  ConfigSectionValue value = 1;
  ConfigSource source = 2;
  // origin is a short human-readable hint — the originating section
  // name for file / settings, or "session" for an override.
  string origin = 3;
}

message GetEffectiveConfigRequest {
  // workspace_dir is reserved for multi-root support; empty selects
  // the ambient workspace.
  string workspace_dir = 1;
  // sections narrows the response. Empty means "all known sections."
  repeated string sections = 2;
  // reveal_secrets opts out of name-pattern redaction. Editors that
  // want to display real token / password values pass true.
  bool reveal_secrets = 3;
}

message GetEffectiveConfigResponse {
  string workspace_dir = 1;
  // values is keyed by section name. The map ordering is not
  // significant; editors sort client-side.
  map<string, ConfigValue> values = 2;
}

message SetOverridesRequest {
  string workspace_dir = 1;
  // overrides maps section name -> new value. To clear an existing
  // override and let lower tiers retake the section, set the
  // section's value oneof to no case (an empty ConfigSectionValue).
  map<string, ConfigSectionValue> overrides = 2;
}

message AppliedOverride {
  ConfigSource previous_source = 1;
  // new_value is the value the section resolved to after the
  // override was applied. May still come from a lower tier if the
  // override was explicitly cleared.
  ConfigSectionValue new_value = 2;
}

message SetOverridesResponse {
  // applied has one entry per requested override, regardless of
  // whether the effective value actually changed.
  map<string, AppliedOverride> applied = 1;
}

message EffectiveConfigServiceSubscribeRequest {
  string workspace_dir = 1;
}

message EffectiveConfigServiceSubscribeResponse {
  string workspace_dir = 1;
  // changes contains only sections whose effective value actually
  // shifted since the previous event. Empty maps are not emitted.
  map<string, ConfigValue> changes = 2;
}

service EffectiveConfigService {
  rpc GetEffectiveConfig(GetEffectiveConfigRequest) returns (GetEffectiveConfigResponse);

  rpc SetOverrides(SetOverridesRequest) returns (SetOverridesResponse);

  // Subscribe streams an event whenever the effective value of any
  // section shifts (override applied/cleared, file change, settings
  // pull, etc.). The first message is NOT a snapshot — clients call
  // GetEffectiveConfig once for that.
  rpc Subscribe(EffectiveConfigServiceSubscribeRequest) returns (stream EffectiveConfigServiceSubscribeResponse);
}
