//
// SecretsService: editor-facing view of pxf.Secret-tagged value ranges
// so clients can render their own masking decoration. Mirrors the
// protolsp/secretRanges request + protolsp/secretRangesChanged
// notification.
//
// SubscribeSecretRanges replaces the JSON-RPC notification with a
// server-streaming RPC keyed by document URI: the first message
// carries the current snapshot; subsequent messages are emitted as
// edits shift the secret-range table. Clients close the stream when
// they're done watching the document.

syntax = "proto3";

package protolsp.v1.rpc;

option go_package = "github.com/trendvidia/protolsp/proto/protolsp/v1/rpc;rpcpb";

import "protolsp/v1/rpc/common.proto";

// SecretForm names where a secret value sits in the document. Mirrors
// the JSON-RPC method's "scalar" / "block" strings.
enum SecretForm {
  SECRET_FORM_UNSPECIFIED = 0;
  // SECRET_FORM_SCALAR: the secret is a single literal — `token: "..."`.
  SECRET_FORM_SCALAR = 1;
  // SECRET_FORM_BLOCK: the secret occupies a multi-line block —
  // `token { ... }` (rare; reserved for forward compatibility).
  SECRET_FORM_BLOCK = 2;
}

message SecretRangeEntry {
  Range range = 1;
  // field_name is the dotted path inside the parent message, e.g.
  // "auth.token". Editors surface it in tooltips.
  string field_name = 2;
  SecretForm form = 3;
}

message SecretsServiceGetRangesRequest {
  TextDocumentIdentifier text_document = 1;
}

message SecretsServiceGetRangesResponse {
  repeated SecretRangeEntry ranges = 1;
}

message SecretsServiceSubscribeRequest {
  TextDocumentIdentifier text_document = 1;
}

message SecretsServiceSubscribeResponse {
  // version is the document version at the time the snapshot was
  // computed. Clients ignore events older than the version they've
  // already applied — out-of-order delivery is possible if multiple
  // edits batch before the stream wakes.
  int32 version = 1;
  repeated SecretRangeEntry ranges = 2;
}

service SecretsService {
  rpc GetRanges(SecretsServiceGetRangesRequest) returns (SecretsServiceGetRangesResponse);

  // Subscribe streams the current snapshot followed by one event per
  // edit-driven recomputation. Events are skipped when the table is
  // byte-identical to the previous emission. The stream terminates
  // when the document closes or the client cancels.
  rpc Subscribe(SecretsServiceSubscribeRequest) returns (stream SecretsServiceSubscribeResponse);
}
