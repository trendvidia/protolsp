syntax = "proto3";

package pxf;

import "google/protobuf/descriptor.proto";

// Go import path for the annotation extension registry. chameleon-
// internal; not part of the public surface. The canonical extension
// implementation lives in protowire-go's encoding/pxf package — this
// generated file just registers descriptors so chameleon's own
// protos can carry the (pxf.required) / (pxf.default) / (pxf.key)
// options.
option go_package = "github.com/trendvidia/protolsp/proto/pxf;pxfpb";

extend google.protobuf.FieldOptions {
  // Mark a field as required in PXF. Absent fields cause a validation error.
  // A field set to null still counts as present.
  bool required = 1314;

  // Default value applied when a field is absent (not null) in PXF.
  // The value is a PXF literal string, e.g. "42", "true", "\"hello\"".
  string default = 1315;

  // Key field of a keyed repeated field (issue #116). Valid only on
  // repeated message-typed fields; the value names a singular string
  // field of the element message. In PXF text the field may then be
  // written as a block of named blocks — entry name = key value,
  // entry order = list order. pb/SBE wire outputs are unchanged.
  string key = 1316;
}
